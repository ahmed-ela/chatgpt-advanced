<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"><title>Current ChatGPT DOM fixture</title>
    <style>
      body { margin: 40px auto; max-width: 850px; padding: 0 28px; font: 18px/1.6 system-ui, sans-serif; color: #172033; background: #fafafa; }
      main > div, article { margin: 20px 0; padding: 18px 24px; border: 1px solid #ddd; border-radius: 14px; background: white; }
      [data-markdown-text-style='user-message'], [data-message-author-role='user'] { color: #526174; }
      [data-composer-markdown] { min-height: 100px; border: 1px solid #999; border-radius: 12px; padding: 16px; background: white; white-space: pre-wrap; }
      button { padding: 8px 20px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <main>
      <!-- Structural attributes observed in ChatGPT on 2026-10-03; sample text only. -->
      <div data-chatgpt-selection-message-id="11111111-1111-4111-8111-111111111111" data-chatgpt-selection-conversation-id="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa">
        <div data-markdown-text-style="user-message"><p>Please explain the latency tradeoff.</p></div>
      </div>
      <div data-chatgpt-selection-message-id="22222222-2222-4222-8222-222222222222" data-chatgpt-selection-conversation-id="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa">
        <div data-markdown-text-style="assistant-message"><p>Set latency budgets for each request stage.</p><p>Preserve throughput and correctness.</p></div>
      </div>
      <div data-chatgpt-selection-message-id="33333333-3333-4333-8333-333333333333" data-chatgpt-selection-conversation-id="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa">
        <div data-markdown-text-style="assistant-message"><p>Measure the tail latency separately.</p></div>
      </div>
      <article data-message-author-role="assistant" data-message-id="legacy-assistant"><p>A legacy assistant response remains selectable.</p></article>
      <article data-message-author-role="user" data-message-id="legacy-user"><p>A legacy user request remains excluded.</p></article>
    </main>
    <section aria-label="Message composer">
      <div contenteditable="true" role="textbox" data-composer-markdown aria-label="Ask ChatGPT"></div>
      <button type="button" aria-label="Send message">Send</button>
    </section>
  </body>
</html>
