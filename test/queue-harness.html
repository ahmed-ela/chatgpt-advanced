<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plannotator persistent queue verification</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #222; font: 16px/1.55 system-ui, sans-serif; }
    header { position: sticky; top: 0; padding: 12px 20px; border-bottom: 1px solid #ddd; background: #fafafa; z-index: 3; }
    header p { margin: 2px 0 8px; font-size: 13px; color: #555; }
    header button, header label { margin-right: 8px; }
    button { border: 1px solid #ccc; border-radius: 8px; padding: 7px 10px; background: white; cursor: pointer; font: inherit; }
    button:disabled { opacity: .4; cursor: default; }
    #state { font-size: 12px; margin-top: 8px; color: #666; }
    main { width: min(760px, calc(100% - 40px)); margin: 28px auto 330px; }
    article { margin: 20px 0; }
    [data-user-message-bubble] { border-radius: 18px; background: #f3f3f3; padding: 10px 16px; margin-left: 90px; white-space: pre-wrap; }
    [data-markdown-text-style="assistant-message"] { white-space: pre-wrap; }
    .turn-action-controls { margin-top: 10px; }
    .turn-action-controls button { font-size: 12px; color: #666; }
    .message-id { font: 10px/1.5 ui-monospace, monospace; color: #888; }
    #composer-zone { position: fixed; width: min(760px, calc(100% - 40px)); bottom: 25px; left: 50%; transform: translateX(-50%); }
    [data-composer-body] { border: 1px solid #ccc; border-radius: 24px; padding: 15px; background: #f7f7f7; box-shadow: 0 3px 12px #0001; }
    [data-composer-markdown] { min-height: 55px; max-height: 150px; overflow-y: auto; outline: none; white-space: pre-wrap; }
    [data-composer-markdown]:empty:before { content: "Type a message, then press Enter while a response is running"; color: #888; pointer-events: none; }
    .composer-controls { display: flex; justify-content: flex-end; }
    .composer-controls button { color: #fff; background: #222; }
    #composer-zone p { margin: 5px 0 0; font-size: 11px; text-align: center; color: #777; }
  </style>
</head>
<body>
  <header aria-label="Verification controls">
    <strong>Persistent queue verification</strong>
    <p>This page only simulates the chat. All queue UI, storage, tab coordination, and dispatch come from the installed extension.</p>
    <button id="begin">Begin response</button>
    <button id="finish">Finish response</button>
    <label><input id="auto" type="checkbox"> Complete each response after 6 seconds</label>
    <button id="reset">Reset mock conversation</button>
    <div id="state" role="status"></div>
  </header>
  <main id="thread" aria-label="Mock conversation"></main>
  <div id="composer-zone">
    <div data-composer-body>
      <div data-composer-markdown contenteditable="true" role="textbox" aria-label="Message ChatGPT" aria-multiline="true"></div>
      <div class="composer-controls"><button id="chat-action" type="button" aria-label="Send message">Send</button></div>
    </div>
    <p>Same URL in multiple tabs shares the simulated conversation. Draft text stays local to each tab.</p>
  </div>
  <script>
    (() => {
      const storageKey = 'plannotator-queue-fixture:' + location.pathname;
      const composer = document.querySelector('[data-composer-markdown]');
      const action = document.getElementById('chat-action');
      const thread = document.getElementById('thread');
      const status = document.getElementById('state');
      const auto = document.getElementById('auto');
      let timer = null;
      const initial = () => ({ revision: 0, busy: false, messages: [
        { id: '11111111-1111-4111-8111-111111111111', role: 'user', text: 'How do I verify a persistent message queue?' },
        { id: '22222222-2222-4222-8222-222222222222', role: 'assistant', text: 'Begin a response with the control above. Type several messages and press Enter to queue them. Reorder or edit the saved messages, open this same URL in another tab, then finish the response to let the queue send one message at a time.', complete: true }
      ] });
      let state;
      function read() { try { return JSON.parse(localStorage.getItem(storageKey)) || initial(); } catch { return initial(); } }
      function save() { state.revision += 1; localStorage.setItem(storageKey, JSON.stringify(state)); render(); }
      function refreshTimer() {
        clearTimeout(timer);
        if (auto.checked && state.busy) timer = setTimeout(finish, 6000);
      }
      function render() {
        thread.replaceChildren();
        for (const message of state.messages) {
          const turn = document.createElement('article');
          const body = document.createElement('div');
          turn.setAttribute('data-chatgpt-search-unit-key', message.id + ':' + message.role);
          turn.setAttribute('data-chatgpt-search-message-ids', message.id);
          if (message.role === 'user') {
            body.setAttribute('data-user-message-bubble', '');
            body.setAttribute('data-markdown-text-style', 'user-message');
          } else {
            turn.setAttribute('data-chatgpt-selection-message-id', message.id);
            body.setAttribute('data-markdown-text-style', 'assistant-message');
          }
          body.textContent = message.text || 'Thinking…';
          turn.append(body);
          if (message.role === 'assistant' && message.complete) {
            const controls = document.createElement('div');
            controls.className = 'turn-action-controls';
            const rating = document.createElement('button');
            rating.setAttribute('aria-label', 'Rate response');
            rating.textContent = 'Rate response';
            const copy = document.createElement('button');
            copy.setAttribute('aria-label', 'Copy');
            copy.textContent = 'Copy';
            controls.append(copy, rating);
            turn.append(controls);
          }
          const id = document.createElement('div');
          id.className = 'message-id';
          id.textContent = message.id;
          turn.append(id);
          thread.append(turn);
        }
        action.setAttribute('aria-label', state.busy ? 'Stop streaming' : 'Send message');
        action.textContent = state.busy ? 'Stop' : 'Send';
        action.disabled = !state.busy && !composer.innerText.trim();
        document.getElementById('begin').disabled = state.busy;
        document.getElementById('finish').disabled = !state.busy;
        status.textContent = (state.busy ? 'Response running' : 'Idle') + ' · revision ' + state.revision + ' · user messages ' + state.messages.filter(m => m.role === 'user').length + (typeof state.dispatchDelayMs === 'number' ? ' · last send after response: ' + state.dispatchDelayMs + ' ms' : '');
        refreshTimer();
      }
      function begin() {
        state = read();
        if (state.busy) return;
        state.busy = true;
        state.messages.push({ id: crypto.randomUUID(), role: 'assistant', text: 'Simulated response is running. Use the composer to add queued messages.', complete: false });
        save();
      }
      function finish() {
        state = read();
        if (!state.busy) return;
        state.busy = false;
        state.lastCompletedAt = Date.now();
        const latest = state.messages.at(-1);
        if (latest?.role === 'assistant') { latest.complete = true; latest.text = 'Response completed. The extension can now dispatch the next queued message.'; }
        save();
      }
      function send() {
        state = read();
        if (state.busy || !composer.innerText.trim()) return;
        if (state.lastCompletedAt) state.dispatchDelayMs = Date.now() - state.lastCompletedAt;
        state.messages.push({ id: crypto.randomUUID(), role: 'user', text: composer.innerText.trim() });
        composer.replaceChildren();
        composer.dispatchEvent(new InputEvent('input', { bubbles: true, inputType: 'deleteContentBackward' }));
        state.busy = true;
        state.messages.push({ id: crypto.randomUUID(), role: 'assistant', text: 'Simulated response is running. Add more queued messages or use Finish response.', complete: false });
        save();
      }
      action.addEventListener('click', () => state.busy ? finish() : send());
      composer.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); if (!state.busy) send(); }
      });
      composer.addEventListener('input', () => { action.disabled = !state.busy && !composer.innerText.trim(); });
      document.getElementById('begin').addEventListener('click', begin);
      document.getElementById('finish').addEventListener('click', finish);
      document.getElementById('reset').addEventListener('click', () => { state = initial(); save(); });
      auto.addEventListener('change', refreshTimer);
      window.addEventListener('storage', event => { if (event.key === storageKey) { state = read(); render(); } });
      state = read();
      if (!localStorage.getItem(storageKey)) localStorage.setItem(storageKey, JSON.stringify(state));
      render();
    })();
  </script>
</body>
</html>
